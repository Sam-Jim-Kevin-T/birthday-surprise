<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday! 🎂</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:Georgia,'Times New Roman',serif;color:#4a1942;overflow:hidden;background:var(--bg);transition:background 1s;--bg:linear-gradient(160deg,#ffd6d6,#ffe8a3 55%,#ffc2d4)}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
.hidden{display:none!important}
.fl{position:fixed;bottom:-60px;z-index:1;opacity:.7;animation:rise var(--d) linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg)}}
.screen{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 24px 120px}
h1{font-size:clamp(2.1rem,10vw,3.6rem);margin:.2em 0;line-height:1.1}
h1 span,.name{color:#e03131}
input{font:inherit;font-size:1.1rem;padding:14px 18px;border-radius:30px;border:2px solid #e03131;width:min(320px,85vw);text-align:center;background:#fff;color:#4a1942;outline:none}
button{font:inherit;font-size:1.1rem;margin-top:16px;padding:13px 32px;border:0;border-radius:30px;background:#e03131;color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(224,49,49,.4)}
.big{font-size:5rem;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(5deg)}}
#page{height:100%}
.in-n{animation:inn .6s cubic-bezier(.2,.8,.2,1)}
.in-p{animation:inp .6s cubic-bezier(.2,.8,.2,1)}
@keyframes inn{from{opacity:0;transform:translateX(60px) scale(.96)}}
@keyframes inp{from{opacity:0;transform:translateX(-60px) scale(.96)}}
.quote{font-size:clamp(1.5rem,6.5vw,2.3rem);line-height:1.4;font-style:italic;max-width:560px}
.quote .w{display:inline-block;opacity:0;animation:pop .6s forwards;animation-delay:var(--t);margin:0 .12em}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mark{font-size:4rem;color:#e03131;line-height:.6;margin-bottom:10px}
.pol{background:#fff;padding:12px 12px 16px;border-radius:6px;box-shadow:0 14px 34px #0003;transform:rotate(-3deg);width:min(330px,80vw);position:relative;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(3deg)}}
.pol:before{content:"";position:absolute;top:-12px;left:38%;width:90px;height:26px;background:#ffd16688;transform:rotate(-4deg)}
.ph{aspect-ratio:4/5;overflow:hidden;background:linear-gradient(135deg,#ffc2d4,#cdb4db);display:flex;align-items:center;justify-content:center;font-size:4rem}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.cap{margin-top:12px;font-size:1.15rem;font-style:italic}
.msg{max-width:540px;font-size:1.2rem;line-height:1.7;background:#ffffffc0;padding:22px;border-radius:20px}
.cake{font-size:6rem;cursor:pointer;position:relative}
.hint{font-size:.9rem;opacity:.7;margin-top:18px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
#bar{background-image:repeating-linear-gradient(45deg,#222 0 6px,#fff 6px 12px)!important;position:fixed;top:env(safe-area-inset-top,0px);left:0;height:5px;background:#e03131;z-index:10;transition:width .5s;width:0}
#nav{position:fixed;bottom:calc(62px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:14px;z-index:10}
#nav button{margin:0;padding:8px 18px;font-size:1rem;background:#fff;color:#e03131;box-shadow:0 3px 10px #0002}
.road{position:fixed;bottom:0;left:0;right:0;height:46px;background:#2b2d33;z-index:3;border-top:4px solid #e03131;overflow:hidden}
.road:before{content:"";position:absolute;left:0;right:0;top:24px;height:4px;background:repeating-linear-gradient(90deg,#fff 0 30px,transparent 30px 60px);animation:lane 1s linear infinite}
@keyframes lane{to{background-position:-60px 0}}
.road .car{position:absolute;top:-2px;font-size:34px;transform:scaleX(-1);animation:drive 7s linear infinite;filter:drop-shadow(0 3px 3px #0006)}
.road .car2{animation-duration:11s;animation-delay:-4s;font-size:28px;top:8px}
@keyframes drive{from{left:-70px}to{left:105%}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<div class="road"><div class="car">🏎️</div><div class="car car2">🚙</div></div>

<!-- GATE -->
<section class="screen" id="gate">
  <div class="big">🏎️</div>
  <h1>A special surprise is waiting…</h1>
  <p>Please enter your name</p>
  <input id="name" placeholder="Your name" autocomplete="off">
  <button id="go">Start the engine 🔑</button>
</section>

<!-- STORY -->
<div id="app" class="hidden">
  <div id="page"></div>
  <div id="nav"><button id="prev">‹ Back</button><button id="next">Next ›</button></div>
</div>

/* ==================================================================== */

const colors=["#ff6b9d","#ffd166","#06d6a0","#4cc9f0","#b388eb","#ff9770"];
const themes=["linear-gradient(160deg,#ffd6d6,#ffe8a3 55%,#ffc2d4)","linear-gradient(160deg,#cfe8ff,#e2e8ff)","linear-gradient(160deg,#fff1c1,#ffc9a3)","linear-gradient(160deg,#d7f5e3,#cfe8ff)","linear-gradient(160deg,#ffe0e0,#e4c1f9)"];
const $=id=>document.getElementById(id);
let NAME="",cur=0;

function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const fill=s=>s.replace(/\{name\}/g,NAME);

// floating hearts/stars
["🚗","🏎️","🚙","🏁","🔑","🛞","💖","⭐"].forEach((s,i)=>{
  for(let k=0;k<2;k++){const f=el("div","fl",s);f.style.cssText=`left:${Math.random()*95}%;font-size:${18+Math.random()*22}px;--d:${9+Math.random()*10}s;animation-delay:${-Math.random()*12}s`;document.body.appendChild(f);}
});

// confetti
const cv=$("c"),ctx=cv.getContext("2d");let P=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
function confetti(n=160){
  for(let i=0;i<n;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,w:6+Math.random()*6,h:8+Math.random()*8,vy:2+Math.random()*3,vx:Math.random()*2-1,a:Math.random()*6,c:colors[i%6]});
  if(!run){run=true;tick();}
}
function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  P.forEach(p=>{p.y+=p.vy;p.x+=p.vx+Math.sin(p.a+=.05);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.w,p.h);});
  P=P.filter(p=>p.y<cv.height+20);
  if(P.length)requestAnimationFrame(tick);else{run=false;ctx.clearRect(0,0,cv.width,cv.height)}
}

// page renderer
function render(i,dir){
  cur=i;const d=PAGES[i],s=el("section","screen "+(dir<0?"in-p":"in-n"));
  document.body.style.setProperty("--bg",themes[i%themes.length]);
  if(d.t==="title"){
    s.append(el("div","big","🎂"));
    const h=el("h1");h.append("Happy Birthday,",el("br"));h.append(el("span","",NAME+"!"));
    s.append(h,el("div","hint","Tap to continue ›"));confetti();
  }else if(d.t==="quote"){
    s.append(el("div","mark","“"));
    const q=el("div","quote");
    fill(d.text).split(" ").forEach((w,k)=>{const sp=el("span","w",w);sp.style.setProperty("--t",k*0.12+"s");q.append(sp)});
    s.append(q);
  }else if(d.t==="photo"){
    const p=el("div","pol"),ph=el("div","ph"),img=new Image();
    img.src=d.src;img.alt="";img.onerror=()=>{ph.textContent=["🌸","💐","🧁","🌷","✨"][i%5]};
    ph.append(img);p.append(ph,el("div","cap",fill(d.caption||"")));s.append(p);
  }else if(d.t==="letter"){
    s.append(el("div","big","💌"),el("div","msg",fill(d.text)));
  }else if(d.t==="wish"){
    const c=el("div","cake","🎂");c.dataset.lit="1";
    s.append(el("h1","","Make a wish…"),c,el("div","hint","Tap the cake to blow the candles 🕯️"));
    c.onclick=e=>{e.stopPropagation();confetti(300);s.querySelector("h1").textContent="May every road you take lead to happiness, "+NAME+"! 🏎️✨";s.querySelector(".hint").textContent="Happy Birthday! I love you ❤️"};
  }
  $("page").replaceChildren(s);
  $("bar").style.width=((i+1)/PAGES.length*100)+"%";
  $("prev").style.visibility=i?"visible":"hidden";
  $("next").style.visibility=i<PAGES.length-1?"visible":"hidden";
}
const go=n=>{if(n>=0&&n<PAGES.length)render(n,n-cur)};

function start(){
  const n=$("name").value.trim();if(!n){$("name").focus();return}
  NAME=n;$("gate").classList.add("hidden");$("app").classList.remove("hidden");render(0,1);
}
$("go").onclick=start;
$("name").onkeydown=e=>{if(e.key==="Enter")start()};
$("prev").onclick=e=>{e.stopPropagation();go(cur-1)};
$("next").onclick=e=>{e.stopPropagation();go(cur+1)};
// tap right/left side, swipe, arrow keys
$("app").addEventListener("click",e=>{if(e.target.closest("button"))return;e.clientX<innerWidth*.3?go(cur-1):go(cur+1)});
let sx=0;
addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60&&!$("app").classList.contains("hidden"))go(cur+(d<0?1:-1))});
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
const q=new URLSearchParams(location.search).get("name");if(q)$("name").value=q;
</script>
</body>
</html>
